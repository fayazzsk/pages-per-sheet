name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/outputs/apk/debug/PagesPerSheet-debug.apk PagesPerSheet.apk
          gh release create "build-${{ github.run_number }}" PagesPerSheet.apk \
            --title "Pages Per Sheet build ${{ github.run_number }}" \
            --notes "Download PagesPerSheet.apk on your phone and install it."
